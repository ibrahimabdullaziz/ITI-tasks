<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>CSS Animation Box</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="controls">
      <input type="button" value="Start" id="startBtn" />
      <input type="button" value="Stop" id="stopBtn" />
      <input type="button" value="Pause" id="pauseBtn" />
    </div>

    <div class="container">
      <div id="box"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
