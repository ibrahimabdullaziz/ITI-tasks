<html>
  <head>
    <title>task 3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="face">
        <img src="facebook.jpg" class="logo" />
        <label class="face-lbl">Login to Facebook</label>
      </div>
      <div class="x">
        <img src="x.jpg" class="logo" />
        <label class="x-lbl">Login to Twitter</label>
      </div>
      <div class="or">Or</div>
      <div>
        <input type="text" placeholder="Username" class="input" />
      </div>

      <div>
        <input type="password" placeholder="*********" class="input" />
      </div>

      <div>
        <div class="keep">
          <input type="checkbox" id="remember" />
          <label for="remember" class="keep">Keep me signed in</label>
        </div>
        <a href="#" class="forget">Forgot Your Password?</a>
      </div>

      <button class="login-btn">Login</button>

      <div>Not a member? <a href="#" class="sign">Sign up now!</a></div>
    </div>
  </body>
</html>
