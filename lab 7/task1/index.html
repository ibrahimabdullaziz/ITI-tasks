<!doctype html>
<html>
  <head>
    <title>To-Do List</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <input type="text" id="taskInput" placeholder="Enter task..." />
    <button id="addBtn">Add</button>

    <table border="1">
      <thead>
        <tr>
          <th>Done</th>
          <th>Task</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="taskTableBody"></tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
