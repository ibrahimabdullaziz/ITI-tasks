<!doctype html>
<html>
  <head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card" id="card">
      <img src="avatar.jpg" alt="Profile Picture" />

      <h2 id="userName">Ibrahim Abdullaziz</h2>
      <p class="title">FullStack Developer</p>

      <div class="hobbies" id="hobbiesList"></div>

      <div class="buttons">
        <button id="editBtn">Edit Name</button>
        <button id="colorBtn">Change Color</button>
      </div>

      <button id="hobbyBtn">Add Hobby</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
